<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eeeddb">
  <title>Atlas</title>
  <link rel="preload" href="/images/connected-biology.png" as="image" fetchpriority="high">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/cover.css">
  <script src="/transition.js" defer></script>

<body class="cover-page">
  <main class="cover" aria-label="Atlas">

    <a class="brand cover-brand" href="/" aria-label="Atlas home">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="brand-name">atlas<span class="brand-period">.</span></span>

      <a class="cover-enter" href="/explore?view=graph" data-enter-atlas>

          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" focusable="false">
            <path d="M6.6 6.6l3.8 3.8m3.6.3 4.1-3.4m-4.7 6.4 4.3 4.5"/>
            <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/>
            <circle cx="5" cy="5" r="2.2"/>
            <circle cx="20" cy="6" r="2.2"/>
            <circle cx="19" cy="20" r="2.2"/>
          </svg>
        </span>
      </a>
    </div>
  </main>
