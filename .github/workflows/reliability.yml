name: Reliability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lightweight test dependencies
        run: python -m pip install requests==2.32.5 indexed-gzip==1.10.3 topk-sdk==0.15.0
      - name: Run offline Python suites and verify production packaging
        env:
          ATLAS_RELIABILITY_REPORT_DIR: ${{ runner.temp }}/reliability-results
        run: bash scripts/check-reliability.sh python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}-results
          path: ${{ runner.temp }}/reliability-results/
          if-no-files-found: ignore

  browser:
    name: Offline Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run offline WebGL, Canvas and applicable proposal/evidence checks
        env:
          ATLAS_RELIABILITY_REPORT_DIR: ${{ runner.temp }}/reliability-results
        run: NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules" bash scripts/check-reliability.sh browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-results
          path: ${{ runner.temp }}/reliability-results/
          if-no-files-found: ignore
