      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;research-decision-loops&#x27;);
    const selector = root.querySelector(&#x27;#rdl-loop&#x27;);
    const caseSelect = root.querySelector(&#x27;#rdl-case&#x27;);
    const svg = root.querySelector(&#x27;#rdl-diagram&#x27;);
    const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
    const definitions = {
      overview: {
        title:&#x27;Whole system&#x27;, cadence:&#x27;Background work + bounded live work&#x27;,
        nodes:[[&#x27;1 · Prepare evidence&#x27;,&#x27;Sources → extraction → validation&#x27;,&#x27;Before queries&#x27;],[&#x27;Store two complementary views&#x27;,&#x27;TopK passages + structured graph&#x27;,&#x27;Versioned records&#x27;],[&#x27;2 · Investigate and recommend&#x27;,&#x27;Candidates → checks → targeted search&#x27;,&#x27;During a query&#x27;],[&#x27;Return a practical decision&#x27;,&#x27;Action + evidence + partner + gaps&#x27;,&#x27;User-facing result&#x27;],[&#x27;3 · Capture feedback&#x27;,&#x27;Preferences or reviewed new evidence&#x27;,&#x27;After a result&#x27;],[&#x27;4 · Revalidate when sources change&#x27;,&#x27;Update affected claims and recommendations&#x27;,&#x27;Background upkeep&#x27;],[&#x27;5 · Evaluate on held-out tasks&#x27;,&#x27;Quality, person-hours, latency and cost&#x27;,&#x27;Offline evaluation&#x27;]],
        forwards:[[0,1],[1,2],[2,3],[3,4]],
        backs:[{from:4,to:2,label:&#x27;Refine&#x27;,side:&#x27;right&#x27;},{from:5,to:0,label:&#x27;Refresh&#x27;,side:&#x27;left&#x27;},{from:6,to:2,label:&#x27;Improve&#x27;,side:&#x27;right&#x27;}],
        detail:&#x27;Evaluation and maintenance run outside the live response; these stages are not one long model call.&#x27;
      },
      prepare: {
        title:&#x27;Evidence preparation loop&#x27;,cadence:&#x27;Background · reuse across queries&#x27;,
        nodes:[[&#x27;Collect permitted source records&#x27;,&#x27;Papers, studies, registries and public profiles&#x27;,&#x27;Importer&#x27;],[&#x27;Preserve source and identifiers&#x27;,&#x27;Snapshot, date, passage and variant identity&#x27;,&#x27;Code&#x27;],[&#x27;Extract source-qualified claims&#x27;,&#x27;Effect, assay conditions and limitations&#x27;,&#x27;Astra&#x27;],[&#x27;Validate and route for review&#x27;,&#x27;Schema + quotations + scientific assessment&#x27;,&#x27;Code + reviewer&#x27;],[&#x27;Publish eligible evidence&#x27;,&#x27;Searchable passages and qualified graph claims&#x27;,&#x27;TopK + graph&#x27;],[&#x27;Quarantine unresolved claims&#x27;,&#x27;Extraction errors or missing context&#x27;,&#x27;Review queue&#x27;]],
        forwards:[[0,1],[1,2],[2,3],[3,4]],
        backs:[{from:3,to:5,label:&#x27;Needs review&#x27;,side:&#x27;right&#x27;},{from:5,to:2,label:&#x27;Correct&#x27;,side:&#x27;left&#x27;}],
        detail:&#x27;Unreviewed claims remain separate; a quotation match alone does not prove a scientific claim.&#x27;
      },
      decision: {
        title:&#x27;Bounded recommendation loop&#x27;,cadence:&#x27;Live · one follow-up round initially&#x27;,
        nodes:[[&#x27;Resolve the research goal&#x27;,&#x27;Variant identity, population and desired milestone&#x27;,&#x27;Code + user context&#x27;],[&#x27;Retrieve in parallel&#x27;,&#x27;TopK passages + bounded graph neighborhood&#x27;,&#x27;TopK + graph&#x27;],[&#x27;Propose concrete actions&#x27;,&#x27;Reuse an asset, contact a partner, resolve a gap&#x27;,&#x27;Astra&#x27;],[&#x27;Check fit and challenge the proposal&#x27;,&#x27;Conditions, access, sources and contradictions&#x27;,&#x27;Code + Astra&#x27;],[&#x27;Investigate decisive missing evidence&#x27;,&#x27;Focused supporting and opposing searches&#x27;,&#x27;Only within budget&#x27;],[&#x27;Validate and rank eligible actions&#x27;,&#x27;Ready for discussion / needs clarification / unsupported&#x27;,&#x27;Code + Astra&#x27;],[&#x27;Return the research handoff&#x27;,&#x27;Cited brief, owner, blockers and next step&#x27;,&#x27;Frontend&#x27;]],
        backs:[{from:4,to:1,label:&#x27;Search once&#x27;,side:&#x27;right&#x27;}],
        detail:&#x27;Skip follow-up when it cannot change the decision; unknowns remain explicit when the budget is reached.&#x27;
      },
      feedback: {
        title:&#x27;Feedback loop&#x27;,cadence:&#x27;On explicit user input&#x27;,
        nodes:[[&#x27;Show the recommendation&#x27;,&#x27;Proposed action and its evidence&#x27;,&#x27;Frontend&#x27;],[&#x27;Capture the reason for feedback&#x27;,&#x27;New constraint, factual correction or outcome&#x27;,&#x27;User / expert&#x27;],[&#x27;Separate preferences from claims&#x27;,&#x27;Preferences adjust ranking; claims need evidence&#x27;,&#x27;Backend&#x27;],[&#x27;Validate new factual material&#x27;,&#x27;Source grounding and appropriate review&#x27;,&#x27;Code + reviewer&#x27;],[&#x27;Reassess affected candidates&#x27;,&#x27;Rerank, narrow the proposal or withdraw it&#x27;,&#x27;Graph + Astra&#x27;]],
        backs:[{from:4,to:0,label:&#x27;Update&#x27;,side:&#x27;right&#x27;}],
        detail:&#x27;A user accepting a recommendation does not make its scientific assumptions true.&#x27;
      },
      refresh: {
        title:&#x27;Evidence maintenance loop&#x27;,cadence:&#x27;Background · incremental updates&#x27;,
        nodes:[[&#x27;Detect a changed source&#x27;,&#x27;New study, correction, retraction or asset update&#x27;,&#x27;Ingestion&#x27;],[&#x27;Locate affected dependencies&#x27;,&#x27;Source → claim → graph edge → recommendation&#x27;,&#x27;Versioned IDs&#x27;],[&#x27;Re-extract and review changes&#x27;,&#x27;Preserve conflicting and superseded evidence&#x27;,&#x27;Astra + reviewer&#x27;],[&#x27;Refresh stores and invalidate caches&#x27;,&#x27;Update only affected records and results&#x27;,&#x27;TopK + graph&#x27;],[&#x27;Reassess affected recommendations&#x27;,&#x27;Retain, downgrade or withdraw with a reason&#x27;,&#x27;Backend&#x27;]],
        backs:[{from:4,to:0,label:&#x27;Next change&#x27;,side:&#x27;right&#x27;}],
        detail:&#x27;Dependency tracking prevents stale evidence from silently supporting an old recommendation.&#x27;
      },
      evaluate: {
        title:&#x27;Evaluation and improvement loop&#x27;,cadence:&#x27;Offline · separate from user latency&#x27;,
        nodes:[[&#x27;Define held-out research tasks&#x27;,&#x27;Useful lead, misleading neighbor and no-route case&#x27;,&#x27;Curated reference set&#x27;],[&#x27;Run comparable workflows&#x27;,&#x27;Portal/search, basic RAG, GraphRAG and our loop&#x27;,&#x27;Same corpus and model where applicable&#x27;],[&#x27;Blind qualified review&#x27;,&#x27;Citation support, fit, omissions and next-action utility&#x27;,&#x27;Reviewer&#x27;],[&#x27;Measure acceptable outcomes&#x27;,&#x27;Human time including corrections; latency and cost&#x27;,&#x27;Measured results&#x27;],[&#x27;Change one component and retest&#x27;,&#x27;Prompts, retrieval, gates or follow-up budget&#x27;,&#x27;Development set → held-out check&#x27;]],
        backs:[{from:4,to:1,label:&#x27;Compare&#x27;,side:&#x27;right&#x27;}],
        detail:&#x27;10× is a target for proposal preparation; study access, recruitment and treatment timelines remain separate.&#x27;
      }
    };
    function example() {
      const variant=caseSelect.value;
      const endings={
        supported:[[&#x27;Evidence supports an initial discussion&#x27;,&#x27;Relevant methods + documented contact route&#x27;,&#x27;Not proof of transferability&#x27;],[&#x27;Recommend a feasibility conversation&#x27;,&#x27;Prepare a cited brief for the asset maintainer&#x27;,&#x27;Ready for discussion&#x27;]],
        unknown:[[&#x27;Critical comparability remains unknown&#x27;,&#x27;Follow-up did not resolve the missing condition&#x27;,&#x27;Do not infer compatibility&#x27;],[&#x27;Recommend resolving the blocker&#x27;,&#x27;Ask a specific methods question before proposing reuse&#x27;,&#x27;Needs clarification&#x27;]],
        conflict:[[&#x27;Evidence shows a key incompatibility&#x27;,&#x27;Required conditions do not match this use&#x27;,&#x27;Reject this reuse candidate&#x27;],[&#x27;Explain the mismatch and next search&#x27;,&#x27;Show the reason; seek a compatible alternative&#x27;,&#x27;Not supported&#x27;]]
      };
      return {title:&#x27;Illustrative asset-reuse decision&#x27;,cadence:&#x27;Synthetic example · no actual scientific recommendation&#x27;,nodes:[[&#x27;Goal: prepare an observational proposal&#x27;,&#x27;Selected variant and defined research population&#x27;,&#x27;User intent&#x27;],[&#x27;Find an existing study asset&#x27;,&#x27;Methods, population, maintainer and evidence&#x27;,&#x27;TopK + graph&#x27;],[&#x27;Propose reusing a documented component&#x27;,&#x27;Treat applicability as a hypothesis&#x27;,&#x27;Candidate action&#x27;],[&#x27;Check the decisive condition&#x27;,&#x27;Are the populations and measurements comparable?&#x27;,&#x27;Bounded follow-up&#x27;],...endings[variant]],backs:[{from:3,to:1,label:&#x27;Check&#x27;,side:&#x27;right&#x27;}],detail:&#x27;The output changes with the evidence: useful action, clarification request or an explicit rejection.&#x27;};
    }
    function element(name, attrs, value) {
      const node=document.createElementNS(ns,name);
      Object.entries(attrs||{}).forEach(([k,v])=&gt;node.setAttribute(k,String(v)));
      if(value!==undefined) node.textContent=value;
      return node;
    }
    function wrap(text,max) {
      const words=text.split(&#x27; &#x27;),lines=[];let line=&#x27;&#x27;;
      words.forEach(word=&gt;{if((line+&#x27; &#x27;+word).trim().length&gt;max&amp;&amp;line){lines.push(line);line=word;}else line=(line+&#x27; &#x27;+word).trim();});
      if(line)lines.push(line);return lines;
    }
    function draw() {
      const data=selector.value===&#x27;example&#x27;?example():definitions[selector.value];
      const width=Math.max(280,root.querySelector(&#x27;#rdl-loops-panel&#x27;).clientWidth||736);
      const small=width&lt;500;
      const margin=small?35:80;
      const nodeWidth=width-margin*2;
      const maxChars=Math.max(22,Math.floor((nodeWidth-22)/(small?7:7.5)));
      const cards=data.nodes.map(n=&gt;({n,head:wrap(n[0],maxChars),sub:wrap(n[1],maxChars),role:wrap(n[2],maxChars)}));
      let y=14;
      cards.forEach(c=&gt;{c.y=y;c.h=18*(c.head.length+c.sub.length+c.role.length)+22;y+=c.h+28;});
      svg.replaceChildren();
      svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${y-12}`);
      svg.setAttribute(&#x27;height&#x27;,String(y-12));
      svg.append(element(&#x27;title&#x27;,{id:&#x27;rdl-svg-title&#x27;},data.title));
      svg.append(element(&#x27;desc&#x27;,{id:&#x27;rdl-svg-desc&#x27;},data.nodes.map(n=&gt;n.join(&#x27;: &#x27;)).join(&#x27;. &#x27;)+&#x27;. Return paths: &#x27;+data.backs.map(b=&gt;`${b.label} from step ${b.from+1} to ${b.to+1}`).join(&#x27;; &#x27;)));
      const defs=element(&#x27;defs&#x27;);
      [&#x27;forward&#x27;,&#x27;return&#x27;].forEach((id,i)=&gt;{const mark=element(&#x27;marker&#x27;,{id:&#x27;rdl-arrow-&#x27;+id,viewBox:&#x27;0 0 8 8&#x27;,refX:7,refY:4,markerWidth:6,markerHeight:6,orient:&#x27;auto-start-reverse&#x27;});mark.append(element(&#x27;path&#x27;,{d:&#x27;M 0 0 L 8 4 L 0 8 z&#x27;,fill:`var(--viz-series-${i+1})`}));defs.append(mark);});
      svg.append(defs);
      const forwards=data.forwards||cards.slice(0,-1).map((c,i)=&gt;[i,i+1]);
      forwards.forEach(([i,j])=&gt;{const c=cards[i];svg.append(element(&#x27;path&#x27;,{d:`M ${width/2} ${c.y+c.h} V ${cards[j].y-4}`,stroke:&#x27;var(--viz-series-1)&#x27;,&#x27;stroke-width&#x27;:1.5,fill:&#x27;none&#x27;,&#x27;marker-end&#x27;:&#x27;url(#rdl-arrow-forward)&#x27;}));});
      data.backs.forEach((b,i)=&gt;{
        const from=cards[b.from],to=cards[b.to],right=b.side===&#x27;right&#x27;;
        const edge=right?width-margin:margin;
        const gutter=right?width-12-i*8:12+i*8;
        const fy=from.y+from.h/2,ty=to.y+to.h/2;
        const path=element(&#x27;path&#x27;,{d:`M ${edge} ${fy} H ${gutter} V ${ty} H ${right?edge+4:edge-4}`,stroke:&#x27;var(--viz-series-2)&#x27;,&#x27;stroke-width&#x27;:1.5,fill:&#x27;none&#x27;,&#x27;marker-end&#x27;:&#x27;url(#rdl-arrow-return)&#x27;});
        path.append(element(&#x27;title&#x27;,{},b.label));svg.append(path);
        if(!small){const label=element(&#x27;text&#x27;,{x:right?gutter-7:gutter+7,y:(fy+ty)/2,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,transform:`rotate(-90 ${right?gutter-7:gutter+7} ${(fy+ty)/2})`,class:&#x27;text-small&#x27;},b.label);svg.append(label);}
      });
      cards.forEach((c,i)=&gt;{
        const group=element(&#x27;g&#x27;);
        group.append(element(&#x27;rect&#x27;,{x:margin,y:c.y,width:nodeWidth,height:c.h,rx:8,fill:i===cards.length-1?&#x27;color-mix(in srgb, var(--viz-series-1) 12%, var(--background))&#x27;:&#x27;var(--background)&#x27;,stroke:&#x27;var(--border)&#x27;,&#x27;stroke-width&#x27;:1}));
        group.append(element(&#x27;rect&#x27;,{x:margin,y:c.y+10,width:3,height:c.h-20,fill:&#x27;var(--viz-series-1)&#x27;}));
        let ty=c.y+21;
        [c.head,c.sub,c.role].forEach((lines,idx)=&gt;{lines.forEach(line=&gt;{group.append(element(&#x27;text&#x27;,{x:width/2,y:ty,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,class:idx?&#x27;sub text-small&#x27;:&#x27;&#x27;,...(idx===0?{&#x27;font-weight&#x27;:500}:{})},line));ty+=18;});});svg.append(group);
      });

  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
